<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Swag Labs — Login</title>
  </head>
  <body>
    <h1>Swag Labs</h1>

    <!-- VERSIÓN 1 (original). Fijate en los nombres de CLASE:
         login-input, login-input--user, login-submit, etc. -->
    <form>
      <label for="user">Username</label>
      <input id="user" class="login-input login-input--user" type="text" />

      <label for="pass">Password</label>
      <input id="pass" class="login-input login-input--pass" type="password" />

      <button class="btn btn-primary login-submit" type="submit">Login</button>
    </form>
  </body>
</html>
